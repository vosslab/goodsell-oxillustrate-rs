[package]
name = "oxillustrate"
version = "26.11.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"

[lib]
name = "oxillustrate"

[[bin]]
name = "illustrate"
path = "src/main.rs"

[dependencies]
clap = { version = ">=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = ">=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = ">=1.0.154"
pdbtbx = { version = ">=0.12.0", default-features = false, features = ["compression"] }
quick-xml = { version = ">=0.42.0", default-features = false }
image = { version = ">=0.25.10", default-features = false, features = ["png"] }
flate2 = { version = ">=1.1.11", default-features = false, features = ["rust_backend"] }
